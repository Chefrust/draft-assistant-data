name: Projections
on:
  schedule:
    - cron: "17 13 * * *"     # every morning
    - cron: "47 15 * * 0"     # Sunday before the early games (injury news)
    - cron: "41 21 * * 4"     # Thursday before kickoff
  workflow_dispatch:
  push:
    paths: ["pipeline/**", ".github/workflows/projections.yml"]
permissions:
  contents: write
concurrency:
  group: projections
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: work/data
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - run: pip install pandas pyarrow scikit-learn scipy
      - run: python pipeline/run.py
      - name: Publish
        run: |
          git config user.name "projections-bot"
          git config user.email "actions@users.noreply.github.com"
          git add projections.csv updated.txt
          git commit -m "Projections $(cat updated.txt | cut -c1-60)" || echo "no change"
          git pull --rebase -X theirs origin main || true
          git push
